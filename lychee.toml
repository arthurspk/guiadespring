# Configuração do verificador de links (https://github.com/lycheeverse/lychee)
# Uso: lychee --no-progress './**/*.md'
#
# O LinkedIn responde HTTP 999 e o Catho responde 403 a qualquer verificador
# automatizado (bloqueio anti-bot), mesmo com a página no ar (verificado
# manualmente com navegador/UA de navegador durante a curadoria). São os
# únicos domínios excluídos da verificação.
exclude = ["^https://www\\.linkedin\\.com/", "^https://www\\.catho\\.com\\.br/"]
